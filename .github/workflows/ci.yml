name: CI

on:
  workflow_dispatch:
  # Auto-triggers (push/pull_request) disabled 2026-08-26 — GitHub Actions runs
  # on this account are stuck/failing at startup (zero jobs dispatched, zero
  # billable runner time), most likely a spending limit or concurrency cap.
  # Re-enable once that's resolved account-side (this repo/workflow has no
  # bug to fix). Can still be run manually via the Actions tab until then.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
